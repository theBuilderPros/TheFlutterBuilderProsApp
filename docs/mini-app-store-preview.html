<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuilderStudio Mini App Preview</title>
    <style>
      :root {
        --bg: #f4f2f1;
        --surface: #ffffff;
        --text: #111111;
        --muted: #585858;
        --border: #ded9e8;
        --orange: #f35a12;
        --orange-soft: #fff0e8;
        --violet: #5b20e5;
        --violet-soft: #eee8ff;
        --mini-blue: #0f71d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #dde3ea;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
      }

      .phone {
        width: 390px;
        height: 844px;
        background: var(--bg);
        border-radius: 34px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(23, 23, 23, 0.28);
      }

      .screen {
        height: 100%;
        overflow: auto;
        padding: 16px 18px 28px;
      }

      .header,
      .search,
      .tabs,
      .slide,
      .icon-item {
        display: flex;
        align-items: center;
      }

      .header {
        gap: 8px;
      }

      .icon-button {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 14px;
        background: var(--violet-soft);
        color: var(--violet);
        font: inherit;
        font-size: 22px;
      }

      .icon-button.primary {
        background: var(--violet);
        color: white;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        flex: 1;
        font-size: 28px;
        line-height: 1.1;
      }

      .search {
        margin-top: 14px;
        gap: 10px;
        padding: 10px 8px 10px 14px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 28px;
      }

      .badge {
        color: var(--orange);
        background: var(--orange-soft);
        border-radius: 99px;
        padding: 6px 10px;
        font-size: 13px;
        font-weight: 800;
      }

      .search span:nth-child(2) {
        flex: 1;
        color: var(--muted);
      }

      button,
      a {
        font: inherit;
      }

      .search button,
      .slide .open {
        border: 0;
        border-radius: 999px;
        background: var(--orange);
        color: white;
        font-weight: 800;
        padding: 10px 14px;
        text-decoration: none;
      }

      .slider {
        margin-top: 14px;
      }

      .viewport {
        overflow: hidden;
      }

      .track {
        display: flex;
        transition: transform 220ms ease;
      }

      .slide-link {
        min-width: 100%;
        color: inherit;
        text-decoration: none;
      }

      .slide {
        height: 170px;
        gap: 14px;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 22px;
      }

      .slide-copy {
        flex: 1;
        min-width: 0;
      }

      .label {
        color: var(--orange);
        font-size: 13px;
        font-weight: 800;
      }

      h2 {
        margin-top: 8px;
        font-size: 24px;
        line-height: 1.12;
      }

      .copy {
        margin-top: 6px;
        color: var(--muted);
        line-height: 1.35;
      }

      .slide .open {
        display: inline-block;
        margin-top: 14px;
      }

      .mini-icon {
        width: 78px;
        height: 78px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: var(--mini-blue);
        color: white;
        font-size: 36px;
        font-weight: 900;
      }

      .mini-icon.small {
        width: 58px;
        height: 58px;
        border-radius: 17px;
        font-size: 28px;
      }

      .rule {
        width: 54px;
        height: 4px;
        margin: 10px auto 0;
        background: var(--orange-soft);
        border-radius: 99px;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 99px;
        background: var(--border);
      }

      .dot.active {
        width: 18px;
        background: var(--orange);
      }

      .panel {
        margin-top: 18px;
        padding: 14px 16px 16px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 22px;
      }

      .tabs {
        gap: 12px;
      }

      .tab {
        flex: 1;
        color: var(--orange);
        font-weight: 800;
      }

      .tab::after {
        content: "";
        display: block;
        width: 58px;
        height: 3px;
        margin-top: 8px;
        border-radius: 99px;
        background: var(--orange);
      }

      .favorite {
        color: var(--text);
        font-weight: 700;
      }

      .icon-item {
        width: 94px;
        flex-direction: column;
        align-items: center;
        margin-top: 18px;
        color: inherit;
        text-decoration: none;
      }

      .icon-item strong {
        margin-top: 8px;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="BuilderStudio mini app preview">
      <section class="screen">
        <header class="header">
          <button class="icon-button" aria-label="Back">&lsaquo;</button>
          <h1>Mini Apps</h1>
          <button class="icon-button" aria-label="More">&bull;&bull;&bull;</button>
          <button class="icon-button primary" aria-label="Mini app center">&#9679;</button>
        </header>

        <div class="search">
          <span class="badge">New</span>
          <span>Search mini apps</span>
          <button onclick="location.href='/assets/mini_app/index.html'">Search</button>
        </div>

        <section class="slider" aria-label="Promoted mini apps">
          <div class="viewport">
            <div class="track" id="promoTrack"></div>
          </div>
          <div class="dots" id="promoDots"></div>
        </section>

        <section class="panel">
          <div class="tabs">
            <div class="tab">Recently Used</div>
            <div class="favorite">My Favorites</div>
          </div>
          <a class="icon-item" href="/assets/mini_app/index.html">
            <span class="mini-icon small">&#9889;</span>
            <strong>Skino Mini</strong>
          </a>
        </section>
      </section>
    </main>

    <script>
      const miniApps = [
        {
          title: "Skino Mini",
          tag: "Featured",
          description: "Your blue mini app, opened inside BuilderStudio.",
          icon: "&#9889;",
          href: "/assets/mini_app/index.html",
        },
      ];

      let active = 0;
      const track = document.querySelector("#promoTrack");
      const dots = document.querySelector("#promoDots");

      function render() {
        track.innerHTML = miniApps
          .map(
            (app) => `
              <a class="slide-link" href="${app.href}">
                <article class="slide">
                  <div class="slide-copy">
                    <span class="label">${app.tag}</span>
                    <h2>${app.title}</h2>
                    <p class="copy">${app.description}</p>
                    <span class="open">Open Mini App</span>
                  </div>
                  <div>
                    <div class="mini-icon" aria-hidden="true">${app.icon}</div>
                    <div class="rule"></div>
                  </div>
                </article>
              </a>
            `,
          )
          .join("");
        dots.innerHTML = miniApps
          .map((_, index) => `<span class="dot ${index === active ? "active" : ""}"></span>`)
          .join("");
      }

      render();
    </script>
  </body>
</html>
